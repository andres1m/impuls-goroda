syntax = "proto3";

package optimizer.v1;

import "google/protobuf/timestamp.proto";
import "optimizer/v1/values.proto";

option go_package = "github.com/andres1m/impuls-goroda/proto/optimizer/v1;optimizerv1";

message LunchMetadata {
  bytes after_visit_id = 1;
  int64 duration_seconds = 2;
}

enum ExternalVenueAvailability {
  EXTERNAL_VENUE_AVAILABILITY_UNSPECIFIED = 0;
  EXTERNAL_VENUE_AVAILABILITY_UNKNOWN = 1;
}

message ExternalVenueSnapshot {
  string provider = 1;
  string external_id = 2;
  string title = 3;
  Coordinate position = 4;
  string address = 5;
  google.protobuf.Timestamp observed_at = 6;
  Price price = 7;
  ExternalVenueAvailability availability = 8;
  VerificationStatus hours_verification = 9;
}

message LunchStop {
  bytes visit_id = 1;
  bytes after_visit_id = 2;
  int64 duration_seconds = 3;
  oneof venue {
    ExternalVenueSnapshot external = 4;
    bytes catalog_visit_id = 5;
  }
}

message LunchTrigger {
  uint32 schema_version = 1;
  repeated LunchStop stops = 2;
}
