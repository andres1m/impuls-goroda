version: "1.0.0"
team_id: "Осуществительное"
service_name: "impuls-goroda-gateway"
base_url: "https://impulsgoroda.duckdns.org"

# TEST_USER_TOKEN is obtained from a valid MAX initData exchange. TEST_ROUTE_ID and
# TEST_ROUTE_REVISION come from a successful optimize response; TEST_SAVED_REVISION
# comes from save. NEW_SHARE_TOKEN is a fresh 32-byte base64url token; the returned
# share_token becomes TEST_SHARE_TOKEN. The route must be a draft for save.
# TEST_RECIPIENT_TOKEN is a separate MAX session; TEST_SHARE_REVISION comes from
# the anonymous shared-route response.
checks:
  - id: "health_readiness_probe"
    summary: "Проверка эксплуатационной готовности сервиса и его зависимостей"
    method: "GET"
    path: "/api/v1/health/ready"
    auth:
      role: "anonymous"
    request:
      headers:
        Accept: "application/json"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["request_id", "status", "checked_at", "capabilities"]
        properties:
          request_id:
            type: "string"
          status:
            type: "string"
            enum: ["ready", "degraded", "unavailable"]
          checked_at:
            type: "string"
            format: "date-time"
          capabilities:
            type: "object"
            required: ["read_saved_routes", "mutate_routes", "optimize", "catalog_updates"]
            properties:
              read_saved_routes:
                type: "string"
                enum: ["ready", "degraded", "unavailable"]
              mutate_routes:
                type: "string"
                enum: ["ready", "degraded", "unavailable"]
              optimize:
                type: "string"
                enum: ["ready", "degraded", "unavailable"]
              catalog_updates:
                type: "string"
                enum: ["ready", "degraded", "unavailable"]

  - id: "auth_max_session"
    summary: "Обмен проверенных данных авторизации MAX (initData) на токен сессии"
    method: "POST"
    path: "/api/v1/auth/max"
    auth:
      role: "anonymous"
    request:
      headers:
        Content-Type: "application/json"
        Accept: "application/json"
      body:
        type: "object"
        required: ["init_data"]
        properties:
          init_data:
            type: "string"
            example: "${TEST_MAX_INIT_DATA}"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["access_token", "token_type", "expires_at", "request_id"]
        properties:
          access_token:
            type: "string"
          token_type:
            type: "string"
            enum: ["Bearer"]
          request_id:
            type: "string"
          expires_at:
            type: "string"
            format: "date-time"

  - id: "optimize_daily_routes"
    summary: "Расчёт трёх контрастных суточных маршрутов досуга по подтверждённым условиям"
    method: "POST"
    path: "/api/v1/routes/optimize"
    auth:
      role: "user"
      token_variable: "TEST_USER_TOKEN"
    request:
      headers:
        Content-Type: "application/json"
        Accept: "application/json"
        Authorization: "Bearer ${TEST_USER_TOKEN}"
        Idempotency-Key: "11111111-1111-4111-8111-111111111101"
      body:
        type: "object"
        required: ["city", "timezone", "start_at", "end_at", "origin", "constraints"]
        properties:
          city:
            type: "string"
            enum: ["moscow", "perm"]
            example: "moscow"
          timezone:
            type: "string"
            example: "Europe/Moscow"
          start_at:
            type: "string"
            format: "date-time"
          end_at:
            type: "string"
            format: "date-time"
          origin:
            type: "object"
            required: ["latitude", "longitude"]
            properties:
              latitude:
                type: "number"
                example: 55.7558
              longitude:
                type: "number"
                example: 37.6173
          constraints:
            type: "object"
            required: ["interest_mask", "excluded_categories", "movement_modes", "load_profile", "budget", "benefit_programs", "audience_claims", "obligations", "soft_preferences", "accepted_unknowns"]
            properties:
              interest_mask:
                type: "string"
                pattern: "^0x[0-9a-fA-F]{16}$"
                example: "0x0000000000000021"
              excluded_categories:
                type: "array"
              movement_modes:
                type: "array"
                items:
                  type: "string"
              load_profile:
                type: "string"
                enum: ["relaxed", "moderate", "intense"]
              benefit_programs:
                type: "array"
              audience_claims:
                type: "array"
              obligations:
                type: "array"
              soft_preferences:
                type: "array"
              accepted_unknowns:
                type: "array"
              pushkin_card_only:
                type: "boolean"
                example: false
              budget:
                type: "object"
                required: ["mode"]
                properties:
                  mode:
                    type: "string"
                    enum: ["none", "advisory", "strict"]
                    example: "none"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["status", "request_id", "data_mode", "warnings", "computation_time_ms", "routes", "conflicts"]
        properties:
          status:
            type: "string"
            enum: ["READY", "PARTIAL", "NO_FEASIBLE_ROUTE", "CONFLICT"]
          request_id:
            type: "string"
          data_mode:
            type: "string"
            enum: ["live", "prepared", "synthetic"]
          computation_time_ms:
            type: "integer"
            minimum: 0
          routes:
            type: "array"
            items:
              type: "object"
              required: ["route_id", "revision", "lifecycle", "city", "plan"]
              properties:
                route_id:
                  type: "string"
                  format: "uuid"
                revision:
                  type: "string"
                lifecycle:
                  type: "string"
                  enum: ["draft"]
                city:
                  type: "string"
                plan:
                  type: "object"
                  required: ["steps", "legs", "result"]

  - id: "get_owner_route"
    summary: "Получение полного расписания, точек посещения и переходов сохранённого маршрута владельца"
    method: "GET"
    path: "/api/v1/routes/${TEST_ROUTE_ID}"
    auth:
      role: "user"
      token_variable: "TEST_USER_TOKEN"
    request:
      headers:
        Accept: "application/json"
        Authorization: "Bearer ${TEST_USER_TOKEN}"
      path_parameters:
        route_id: "${TEST_ROUTE_ID}"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["request_id", "route"]
        properties:
          request_id:
            type: "string"
          route:
            type: "object"
            required: ["route_id", "revision", "lifecycle", "city", "plan"]
            properties:
              route_id:
                type: "string"
                format: "uuid"
              revision:
                type: "string"
              city:
                type: "string"
              lifecycle:
                type: "string"
                enum: ["draft", "saved"]
              plan:
                type: "object"
                required: ["timezone", "steps", "legs", "result"]

  - id: "save_owner_route"
    summary: "Фиксация черновика маршрута в постоянном статусе сохранённого плана"
    method: "POST"
    path: "/api/v1/routes/${TEST_ROUTE_ID}/save"
    auth:
      role: "user"
      token_variable: "TEST_USER_TOKEN"
    request:
      headers:
        Accept: "application/json"
        Authorization: "Bearer ${TEST_USER_TOKEN}"
        Idempotency-Key: "11111111-1111-4111-8111-111111111102"
        If-Match: '"${TEST_ROUTE_REVISION}"'
      path_parameters:
        route_id: "${TEST_ROUTE_ID}"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["route_id", "revision", "request_id", "status", "conflicts"]
        properties:
          route_id:
            type: "string"
            format: "uuid"
          revision:
            type: "string"
          status:
            type: "string"
            enum: ["READY", "PARTIAL", "UNCHANGED"]
          request_id:
            type: "string"
          conflicts:
            type: "array"

  - id: "create_route_share"
    summary: "Создание защищённой ссылки для анонимного просмотра маршрута другими пользователями"
    method: "POST"
    path: "/api/v1/routes/${TEST_ROUTE_ID}/share"
    auth:
      role: "user"
      token_variable: "TEST_USER_TOKEN"
    request:
      headers:
        Content-Type: "application/json"
        Accept: "application/json"
        Authorization: "Bearer ${TEST_USER_TOKEN}"
        Idempotency-Key: "11111111-1111-4111-8111-111111111103"
        If-Match: '"${TEST_SAVED_REVISION}"'
      path_parameters:
        route_id: "${TEST_ROUTE_ID}"
      body:
        type: "object"
        required: ["share_token"]
        properties:
          share_token:
            type: "string"
            example: "${NEW_SHARE_TOKEN}"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["share_token", "created_at", "deep_link", "revision", "status", "request_id"]
        properties:
          share_token:
            type: "string"
          created_at:
            type: "string"
            format: "date-time"
          deep_link:
            type: "string"
          revision:
            type: "string"
          status:
            type: "string"
            enum: ["READY", "UNCHANGED"]
          request_id:
            type: "string"

  - id: "read_shared_route"
    summary: "Анонимный просмотр расшаренного маршрута без персональных данных автора"
    method: "GET"
    path: "/api/v1/shared-routes/${TEST_SHARE_TOKEN}"
    auth:
      role: "anonymous"
    request:
      headers:
        Accept: "application/json"
      path_parameters:
        share_token: "${TEST_SHARE_TOKEN}"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["request_id", "route"]
        properties:
          request_id:
            type: "string"
          route:
            type: "object"
            required: ["revision", "city", "timezone", "result", "steps", "legs"]

  - id: "copy_shared_route"
    summary: "Создание собственного приватного черновика из общей версии маршрута"
    method: "POST"
    path: "/api/v1/shared-routes/${TEST_SHARE_TOKEN}/copy"
    auth:
      role: "user"
      token_variable: "TEST_RECIPIENT_TOKEN"
    request:
      headers:
        Content-Type: "application/json"
        Accept: "application/json"
        Authorization: "Bearer ${TEST_RECIPIENT_TOKEN}"
        Idempotency-Key: "11111111-1111-4111-8111-111111111104"
        If-Match: '"${TEST_SHARE_REVISION}"'
      path_parameters:
        share_token: "${TEST_SHARE_TOKEN}"
      body:
        type: "object"
        required: ["origin", "accepted_unknowns"]
        properties:
          origin:
            type: "object"
            required: ["latitude", "longitude"]
            properties:
              latitude:
                type: "number"
                example: 55.7558
              longitude:
                type: "number"
                example: 37.6173
          accepted_unknowns:
            type: "array"
            items:
              type: "string"
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["status", "request_id", "route"]
        properties:
          status:
            type: "string"
            enum: ["READY", "PARTIAL"]
          request_id:
            type: "string"
          route:
            type: "object"
            required: ["route_id", "revision", "lifecycle", "plan"]

  - id: "search_nearby_lunch"
    summary: "Поиск кафе и заведений питания поблизости от текущей геопозиции пользователя через геосервис"
    method: "POST"
    path: "/api/v1/routes/${TEST_ROUTE_ID}/lunch/search"
    auth:
      role: "user"
      token_variable: "TEST_USER_TOKEN"
    request:
      headers:
        Content-Type: "application/json"
        Accept: "application/json"
        Authorization: "Bearer ${TEST_USER_TOKEN}"
      path_parameters:
        route_id: "${TEST_ROUTE_ID}"
      body:
        type: "object"
        required: ["position", "radius_meters"]
        properties:
          position:
            type: "object"
            required: ["latitude", "longitude"]
            properties:
              latitude:
                type: "number"
                example: 55.7558
              longitude:
                type: "number"
                example: 37.6173
          radius_meters:
            type: "integer"
            enum: [300, 500, 800, 1000]
            example: 500
    response:
      status: 200
      content_type: "application/json"
      body:
        type: "object"
        required: ["request_id", "searched_at", "candidates", "radius_meters"]
        properties:
          request_id:
            type: "string"
          searched_at:
            type: "string"
            format: "date-time"
          radius_meters:
            type: "integer"
          candidates:
            type: "array"
            items:
              type: "object"
              required: ["provider", "external_id", "title", "position", "distance_meters"]
              properties:
                external_id:
                  type: "string"
                title:
                  type: "string"
                position:
                  type: "object"
                  required: ["latitude", "longitude"]
                  properties:
                    latitude:
                      type: "number"
                    longitude:
                      type: "number"
