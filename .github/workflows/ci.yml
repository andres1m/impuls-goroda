name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          setup_only: true
      - name: Lint proto
        run: buf lint
      - name: Generated code is up to date
        run: |
          buf generate
          git add --intent-to-add proto
          git diff --exit-code -- proto
      - name: No breaking proto changes
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.55.0 lint --extends=minimal openapi.yaml

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make build
      - run: go mod verify
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Built with the project's Go: a linter built with an older Go refuses this module.
          install-mode: goinstall
          # Existing findings belong to their services; the gate keeps new code clean.
          only-new-issues: true

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make race
      - run: make cover-optimizer
      - run: make cover
      - name: Coverage summary
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            tail -n 1 bin/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: bin/coverage.*

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Stand secrets
        run: |
          for name in POSTGRES_PASSWORD TEMPORAL_DB_PASSWORD GATEWAY_DB_PASSWORD OPTIMIZER_DB_PASSWORD \
            SYNCER_DB_PASSWORD REDIS_PASSWORD MAX_BOT_TOKEN MAX_WEBHOOK_SECRET; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done
      - name: Database
        run: docker compose up -d --wait postgres
      - name: Migrations apply, roll back fully and apply again
        run: |
          set -a; . ./.env; set +a
          docker compose run --rm migrate
          docker compose run --rm --no-deps migrate -path=/migrations \
            "-database=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/impuls?sslmode=disable" down -all
          docker compose run --rm --no-deps migrate
      - name: Service roles
        run: docker compose run --rm --no-deps db-users
      - name: Synthetic catalog
        run: docker compose run --rm --no-deps --build syncer seed
      - name: Integration tests
        run: |
          set -a; . ./.env; set +a
          url() { echo "postgres://$1:$2@localhost:5432/impuls?sslmode=disable"; }
          export GATEWAY_TEST_DATABASE_URL=$(url gateway_svc "$GATEWAY_DB_PASSWORD")
          export OPTIMIZER_TEST_DATABASE_URL=$(url optimizer_svc "$OPTIMIZER_DB_PASSWORD")
          export SYNCER_TEST_DATABASE_URL=$(url syncer_svc "$SYNCER_DB_PASSWORD")
          make test-integration OPTIMIZER_FIXTURE_DATABASE_URL="$(url postgres "$POSTGRES_PASSWORD")"
      - name: Database logs
        if: failure()
        run: docker compose logs postgres

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Four prototype screen tests on main expect an older layout; the step turns into a gate
      # once they match the screen again. Its failure stays visible on the run.
      - run: npm test
        continue-on-error: true
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: .
            dockerfile: docker/gateway/Dockerfile
            gate: true
          - name: optimizer
            context: .
            dockerfile: docker/optimizer/Dockerfile
            gate: true
          - name: syncer
            context: .
            dockerfile: docker/syncer/Dockerfile
            gate: true
          # Upstream postgis image: its OS packages and gosu are reported, not gated.
          - name: postgres
            context: docker/postgres
            dockerfile: docker/postgres/Dockerfile
            gate: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ci/${{ matrix.name }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code ${{ matrix.gate && 1 || 0 }} \
            "ci/${{ matrix.name }}:${{ github.sha }}"

  vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy dependencies
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  bench:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Optimizer benchmarks
        run: |
          mkdir -p bin
          go test -run '^$' -bench '^Benchmark(Optimize|Recompute|Search|Repair)$' -benchmem -count 5 \
            ./services/optimizer/internal/usecase/ ./services/optimizer/internal/solver/ | tee bin/bench.txt
      - name: Benchmark summary
        run: |
          {
            echo "### Optimizer benchmarks"
            echo
            echo "Shared runner, $(nproc) cores: compare runs of this job with each other, not with BENCHMARKS.md."
            echo
            echo '```'
            grep -E '^(Benchmark|ok|FAIL)' bin/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: bin/bench.txt
