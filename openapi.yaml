        proposal:
          $ref: '#/components/schemas/RouteProposal'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/RouteChange'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    ApplyProposalRequest:
      type: object
      additionalProperties: false
