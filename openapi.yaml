        request_id:
          $ref: '#/components/schemas/RequestID'
        route:
          $ref: '#/components/schemas/SharedRoute'
    RouteChange:
      type: object
      additionalProperties: false
      required: [kind, scope, message]
      properties:
        kind:
          type: string
          enum: [kept, removed, replaced, time_shifted, cost_changed, participation_action, verification_changed]
        scope:
          type: string
          enum: [route, visit, leg]
        before_visit_id:
          $ref: '#/components/schemas/UUID'
        after_visit_id:
          $ref: '#/components/schemas/UUID'
        leg_position:
