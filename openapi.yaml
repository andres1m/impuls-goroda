              $ref: '#/components/schemas/CapabilityStatus'
            catalog_updates:
              $ref: '#/components/schemas/CapabilityStatus'
  examples:
    NoFeasibleRoute:
      summary: Valid request with no feasible route
      value:
        status: NO_FEASIBLE_ROUTE
        request_id: 11111111-1111-4111-8111-111111111111
        data_mode: prepared
        data_as_of: '2026-09-26T10:00:00Z'
        warnings:
          - code: NO_AVAILABLE_SESSIONS
            scope: route
            message: No visits satisfy the confirmed time window
        computation_time_ms: 18
        routes: []
        conflicts: []
    DomainConflict:
      summary: Mutually incompatible obligations are a domain result
      value:
        status: CONFLICT
        request_id: 11111111-1111-4111-8111-111111111111
        data_mode: live
        data_as_of: '2026-09-26T10:00:00Z'
        warnings: []
        computation_time_ms: 7
        routes: []
        conflicts:
          - code: OVERLAPPING_OBLIGATIONS
            visit_ids:
              - 22222222-2222-4222-8222-222222222222
              - 33333333-3333-4333-8333-333333333333
            message: Confirmed visits overlap
    StaleRevision:
      summary: The route changed after the client read it
      value:
        code: REVISION_CONFLICT
        message: Route revision is stale
        request_id: 11111111-1111-4111-8111-111111111111
        retryable: false
        current_revision: '8'
