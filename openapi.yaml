      properties:
        position:
          type: integer
          format: int32
          minimum: 1
        from_kind:
          type: string
          enum: [origin, visit]
        to_kind:
          type: string
          enum: [visit, destination]
        from_visit_id:
          $ref: '#/components/schemas/UUID'
        to_visit_id:
          $ref: '#/components/schemas/UUID'
        departure_at:
