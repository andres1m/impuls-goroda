          $ref: '#/components/schemas/RequestID'
        route_id:
          $ref: '#/components/schemas/UUID'
        revision:
          $ref: '#/components/schemas/Revision'
        route:
          $ref: '#/components/schemas/OwnerRoute'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    ProposalResponse:
      type: object
      additionalProperties: false
      required: [status, request_id, route_id, revision, changes, conflicts]
      properties:
        status:
          type: string
          enum: [PROPOSED, CONFLICT, UNCHANGED]
        request_id:
          $ref: '#/components/schemas/RequestID'
        route_id:
