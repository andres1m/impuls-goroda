        changes:
          type: array
          items:
            $ref: '#/components/schemas/RouteChange'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
        effective_start_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        applied_revision:
          $ref: '#/components/schemas/Revision'
    RouteCommandResponse:
      type: object
      additionalProperties: false
      required: [status, request_id, route_id, revision, conflicts]
      properties:
        status:
          type: string
          enum: [READY, PARTIAL, CONFLICT, UNCHANGED]
