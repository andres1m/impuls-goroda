        revision:
          $ref: '#/components/schemas/Revision'
        city:
          type: string
          minLength: 1
          maxLength: 64
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        result:
          type: string
          enum: [READY, PARTIAL]
        archetype_id:
