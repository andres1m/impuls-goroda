          format: int32
        before_cost:
          $ref: '#/components/schemas/Money'
        after_cost:
          $ref: '#/components/schemas/Money'
        action:
          type: string
          maxLength: 128
        before_verification:
          type: string
          enum: [verified, estimated, unknown, unavailable]
        after_verification:
          type: string
          enum: [verified, estimated, unknown, unavailable]
        message:
          type: string
          minLength: 1
          maxLength: 512
    RouteProposal:
      type: object
      additionalProperties: false
      required: [proposal_id, base_revision, base_catalog_revision, reason, state, candidate, changes, conflicts, created_at]
      properties:
        proposal_id:
          $ref: '#/components/schemas/UUID'
        base_revision:
          $ref: '#/components/schemas/Revision'
        base_catalog_revision:
          $ref: '#/components/schemas/CatalogRevision'
        reason:
          type: string
          enum: [delay, cancel, delete, pin, weather]
        state:
          type: string
          enum: [pending, applied, rejected, invalidated]
        candidate:
