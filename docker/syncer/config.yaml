logger:
  stdout: true
  level: info

telemetry:
  otlp-endpoint: jaeger:4317
  sample-ratio: 1

database:
  host: postgres://syncer_svc:${SYNCER_DB_PASSWORD}@postgres:5432/impuls?sslmode=disable
  connection-timeout: 5s
  max-conns: 10
  min-conns: 0
  max-conn-lifetime: 30m

redis:
  mode: cluster
  addresses:
    - redis-1:6379
    - redis-2:6379
    - redis-3:6379
  password: ${REDIS_PASSWORD}
  connection-timeout: 5s
  read-timeout: 3s
  write-timeout: 3s

temporal:
  host-port: temporal:7233
  namespace: impuls
  queue-name: catalog-sync
  worker-count: 4

kafka:
  brokers:
    - kafka:9092
  raw-topic: integration.raw
  raw-partitions: 3
  # Raw data the syncer cannot read, with the reason, for a person to look at.
  dlq-topic: dlq.integration.raw
  consumer-group: syncer-raw

gateway-client:
  host: gateway
  port: 50052
  use_tls: false

# Sends catalog announcements recorded with each publication once it commits.
delivery:
  poll-interval: 500ms
  batch: 100
  lease: 30s
  backoff-min: 1s
  backoff-max: 1m

ops-server:
  port: 9090
  read-timeout: 5s
  write-timeout: 10s
  idle-timeout: 60s

ai:
  openrouter:
    base-url: https://openrouter.ai/api/v1
    # `syncer embed` needs a key; the other commands run without one.
    api-key: ${OPENROUTER_API_KEY}
    timeout: 30s
  polza:
    base-url: https://polza.ai/api/v1
    api-key: ${POLZA_API_KEY}
    timeout: 30s
  embedding:
    # openrouter | polza | local (local is not implemented yet)
    provider: polza
    # Must match the optimizer's model, or its free-text search finds no vectors.
    model: openai/text-embedding-3-small
    dimensions: 384
  text:
    provider: polza
    model: openai/gpt-4o-mini
