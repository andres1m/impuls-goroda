logger:
  stdout: true
  level: info

database:
  host: postgres://optimizer_svc:${OPTIMIZER_DB_PASSWORD}@postgres:5432/impuls?sslmode=disable
  connection-timeout: 5s
  max-conns: 10
  min-conns: 0
  max-conn-lifetime: 30m

redis:
  mode: cluster
  addresses:
    - redis-1:6379
    - redis-2:6379
    - redis-3:6379
  password: ${REDIS_PASSWORD}
  connection-timeout: 5s
  read-timeout: 3s
  write-timeout: 3s

grpc-server:
  port: 50051
  max_recv_msg_size: 4194304
  use_tls: false

ops-server:
  port: 9090
  read-timeout: 5s
  write-timeout: 10s
  idle-timeout: 60s

planner:
  currency: RUB
  # Starting values until the search is measured.
  beam-width: 16
  parallelism: 4
  # Minutes of walking through fully scenic surroundings earn back this much of their cost;
  # each weight must stay below the 0.2 charged per minute of travel.
  scenic-weights:
    perm: 0.10
    moscow: 0.05

scenic:
  layer-dir: /routing/current/scenic

routing:
  request-timeout: 2s
  snap-radius-meters: 500
  cities:
    perm: &city-routing
      foot: http://osrm-foot:5000
      car: http://osrm-car:5000
      walk-threshold-meters: 1800
      walk-meters-per-minute: 75
      transit-wait-minutes: 12
      transit-meters-per-minute: 300
      # Pickup or parking and the congestion factor are team assumptions, not measurements.
      car-overhead-minutes: 10
      car-congestion-factor: 1.3
    moscow: *city-routing
