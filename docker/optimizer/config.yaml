logger:
  stdout: true
  level: info

database:
  host: postgres://optimizer_svc:${OPTIMIZER_DB_PASSWORD}@postgres:5432/impuls?sslmode=disable
  connection-timeout: 5s
  max-conns: 10
  min-conns: 0
  max-conn-lifetime: 30m

redis:
  mode: cluster
  addresses:
    - redis-1:6379
    - redis-2:6379
    - redis-3:6379
  password: ${REDIS_PASSWORD}
  connection-timeout: 5s
  read-timeout: 3s
  write-timeout: 3s

ops-server:
  port: 9090
  read-timeout: 5s
  write-timeout: 10s
  idle-timeout: 60s
