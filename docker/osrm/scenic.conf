# Green and water areas that make a walk scenic, as osmium tags-filter expressions. The optimizer's
# scenic-grid reads the same file, so only areas matching these lines count.
a/leisure=park,garden,nature_reserve
a/landuse=forest,grass,meadow,recreation_ground,village_green
a/natural=wood,water,scrub,grassland,wetland,beach
a/water
a/waterway=riverbank
