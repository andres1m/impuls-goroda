worker_processes auto;
error_log /dev/null;

events {}

http {
    server_tokens off;

    map $uri $safe_request_path {
        default $uri;
        ~(?:^|/)shared-routes(?:/|$) "[shared-route]";
    }

    log_format safe_access escape=json
        '{"method":"$request_method","path":"$safe_request_path",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"duration_seconds":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout safe_access;

    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_x_forwarded_proto $request_scheme_out {
        https   https;
        default $scheme;
    }

    upstream gateway {
        server gateway:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id_out;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $request_scheme_out;
        }
    }
}
