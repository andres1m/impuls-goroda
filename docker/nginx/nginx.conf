worker_processes auto;

events {}

http {
    server_tokens off;

    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_x_forwarded_proto $request_scheme_out {
        https   https;
        default $scheme;
    }

    upstream gateway {
        server gateway:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id_out;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $request_scheme_out;
        }
    }
}
